task:
  hand: left
  crossing_direction: left_to_right
  centerline_u: 0.5
  target_side: right
tracking:
  max_num_hands: 1
  model_complexity: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  max_gap_ms: 100
alignment:
  flash_threshold_gray: 245
  flash_rise_threshold_gray: 20
  flash_after_touch_delay_ms: 0
  uncertainty_ms: 50
prediction:
  crossing_margin_u: 0.0
  reset_gap_ms: 300
  linear_history_ms: 100
  linear_horizon_ms: 100
  linear_min_points: 3
evaluation:
  hit_radii_mm:
  - 10
  - 20
  - 30
  lead_times_ms:
  - 50
  - 100
  - 150
  - 200
render:
  trajectory_tail: 18
collection:
  trial_count: 30
  inter_trial_delay_ms: 250
  flash_duration_ms: 80
  target_top_exclusion_fraction: 0.25
  target_v_max: 0.92
review:
  sample_count: 12
  preview_height_px: 480
  purpose: data quality review, no prediction evaluation
  flash_roi_preview_px: [455, 190, 570, 375]
  flash_thresholds_gray: [150, 175, 200, 225, 245]
  flash_reset_hysteresis_gray: 10
  other_hand_wrist_min_fraction_x: 0.75
  operating_hand_crop_preview_px: [250, 40, 640, 480]
  screen_boundary_samples:
    - frame_index: 0
      corners_preview_px: [[431, 145], [571, 140], [601, 461], [452, 470]]
    - frame_index: 1019
      corners_preview_px: [[438, 88], [588, 82], [614, 414], [460, 424]]
    - frame_index: 1868
      corners_preview_px: [[423, 69], [577, 61], [600, 401], [443, 412]]

annotation:
  marker_radius_px: 12
  marker_thickness_px: 3
  text_scale: 0.7
  video_crf: 20
  video_preset: fast


