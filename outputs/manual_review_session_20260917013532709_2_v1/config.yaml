schema_version: 3

# 旧采集记录没有 device_id 时使用的默认设备；新记录按 device_id 自动选择。
device: huawei_mate_80_pro
devices:
  huawei_pura_x:
    model: "Huawei Pura X"
    screen_width_px: 1320
    screen_height_px: 2120
    # 填写实测采集区域宽高（mm），全屏时即屏幕显示区，不是机身尺寸。
    region_width_mm: 84.6
    region_height_mm: 135.8
  huawei_mate_80_pro:
    model: "Huawei Mate 80 Pro"
    screen_width_px: 1280
    screen_height_px: 2832
    region_width_mm: 70.6
    region_height_mm: 156.2
  iphone_16:
    model: "iPhone 16"
    screen_width_px: 1179
    screen_height_px: 2556
    region_width_mm: 65.1
    region_height_mm: 141.2

task:
  hand: left
  crossing_direction: left_to_right
  centerline_u: 0.5
  target_side: right

tracking:
  max_num_hands: 1
  model_complexity: 0
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  max_gap_ms: 100

alignment:
  flash_threshold_gray: 245
  flash_rise_threshold_gray: 20
  flash_after_touch_delay_ms: 0
  uncertainty_ms: 50

prediction:
  crossing_margin_u: 0.0
  reset_gap_ms: 300
  linear_history_ms: 100
  linear_horizon_ms: 100
  linear_min_points: 3

evaluation:
  hit_radii_mm: [10, 20, 30]
  lead_times_ms: [50, 100, 150, 200]

render:
  trajectory_tail: 18

review:
  before_flash_ms: 1000
  after_flash_ms: 200
  display_max_width_px: 1280
  trace_tail: 18
  slow_playback_multiplier: 4.0

collection:
  trial_count: 30
  inter_trial_delay_ms: 250
  flash_duration_ms: 80
  target_top_exclusion_fraction: 0.3333333333333333
  target_v_max: 0.92
