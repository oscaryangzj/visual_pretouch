<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>visual_pretouch data collection</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    body { font: 16px system-ui, sans-serif; touch-action: none; user-select: none; }
    #phone-area { position: fixed; inset: 0; }
    #target { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px;
      border-radius: 50%; background: #ff3b30; border: 4px solid white;
      box-shadow: 0 0 0 2px #111; display: none; touch-action: none; }
    #panel { position: fixed; z-index: 3; inset: 0; display: flex; align-items: center;
      justify-content: center; padding: max(24px, env(safe-area-inset-top)) 24px
      max(24px, env(safe-area-inset-bottom)); background: rgba(0,0,0,.88); }
    #card { width: min(420px, 100%); padding: 24px; text-align: center; background: #202124;
      border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,.35); }
    #instructions { margin: 0 0 20px; line-height: 1.55; }
    #device { width: 100%; margin: 8px 0 12px; padding: 10px; border-radius: 8px;
      background: #303134; color: white; border: 1px solid #666; font: inherit; }
    #display-info { margin-bottom: 18px; font-size: 13px; color: #ddd; line-height: 1.5; }
    button { border: 0; border-radius: 10px; padding: 13px 20px; min-width: 112px;
      font-size: 18px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #start { background: #0a84ff; color: white; }
    #export { background: #30d158; color: #052e12; display: none; }
    #status { margin-top: 14px; font-size: 14px; color: #ddd; }
    #progress { position: fixed; z-index: 2; left: max(10px, env(safe-area-inset-left));
      top: max(10px, env(safe-area-inset-top)); display: none; padding: 5px 8px;
      border-radius: 7px; background: rgba(0,0,0,.62); color: white; font-size: 13px;
      line-height: 1; pointer-events: none; }
    body.collecting #panel { display: none; }
    body.collecting #progress { display: block; }
    body.flash #phone-area { background: white; }
    body.flash #target, body.flash #panel, body.flash #progress { visibility: hidden; }
  </style>
</head>
<body>
  <div id="phone-area"><div id="target" aria-label="target"></div></div>
  <div id="panel">
    <div id="card">
      <p id="instructions">左手拇指从左侧跨过屏幕中线，点击右半屏目标。开始后页面会尝试进入全屏，每次点击后屏幕会短暂闪白。</p>
      <label for="device">采集样机</label>
      <select id="device"><option value="">请选择样机</option></select>
      <div id="display-info"></div>
      <div>
        <button id="start" disabled>开始采集</button><button id="export">导出数据</button>
      </div>
      <div id="status"></div>
    </div>
  </div>
  <div id="progress" aria-live="polite"></div>
  <script>
    const CONFIG = {
      schema_version: 3,
      hand: "left",
      crossing_direction: "left_to_right",
      trial_count: 30,
      flash_duration_ms: 80,
      inter_trial_delay_ms: 250,
      target_top_exclusion_fraction: 1 / 3,
      target_v_max: 0.92
    };
    // 与 config.yaml 的 devices 同步，独立页面不读取本地 YAML。
    const DEVICES = {
      huawei_pura_x: {
        model: "Huawei Pura X", screen_width_px: 1320, screen_height_px: 2120,
        region_width_mm: 84.6, region_height_mm: 135.8
      },
      huawei_mate_80_pro: {
        model: "Huawei Mate 80 Pro", screen_width_px: 1280, screen_height_px: 2832,
        region_width_mm: 70.6, region_height_mm: 156.2
      },
      iphone_16: {
        model: "iPhone 16", screen_width_px: 1179, screen_height_px: 2556,
        region_width_mm: 65.1, region_height_mm: 141.2
      }
    };
    const deviceSelect = document.getElementById("device");
    const displayInfo = document.getElementById("display-info");
    const target = document.getElementById("target");
    const startButton = document.getElementById("start");
    const exportButton = document.getElementById("export");
    const instructions = document.getElementById("instructions");
    const status = document.getElementById("status");
    const progress = document.getElementById("progress");
    const records = [];
    let active = false, trial = 0, targetUV = null, nextTimer = null;
    let sessionDeviceId = null, sessionDisplay = null, sessionRegion = null;
    let sessionId = null, sessionNumber = 0;

    function region() {
      const r = document.getElementById("phone-area").getBoundingClientRect();
      return { left: r.left, top: r.top, width: r.width, height: r.height };
    }
    function displayDimensions(deviceId = sessionDeviceId || deviceSelect.value) {
      const device = DEVICES[deviceId] || {};
      return {
        screen_width_css_px: window.screen.width,
        screen_height_css_px: window.screen.height,
        device_pixel_ratio: window.devicePixelRatio || 1,
        screen_width_px: device.screen_width_px ?? null,
        screen_height_px: device.screen_height_px ?? null,
        region_width_mm: device.region_width_mm ?? null,
        region_height_mm: device.region_height_mm ?? null,
        fullscreen: !!(document.fullscreenElement || document.webkitFullscreenElement)
      };
    }
    function updateDisplayInfo() {
      const d = displayDimensions(deviceSelect.value), r = region();
      const configured = d.screen_width_px == null ? "请选择样机以查看配置尺寸" :
        `配置分辨率 ${d.screen_width_px} × ${d.screen_height_px} px；配置物理尺寸 ${d.region_width_mm} × ${d.region_height_mm} mm`;
      displayInfo.textContent = `${configured}；屏幕 ${d.screen_width_css_px} × ${d.screen_height_css_px} CSS px；DPR ${d.device_pixel_ratio}；采集区域 ${Math.round(r.width)} × ${Math.round(r.height)} CSS px`;
    }
    function nextTarget() {
      if (trial >= CONFIG.trial_count) {
        active = false; target.style.display = "none"; document.body.classList.remove("collecting");
        instructions.textContent = `已完成 ${records.length} 次采集。请先停止眼镜录像，再导出触点和会话数据。`;
        exportButton.style.display = "inline-block";
        status.textContent = "导出时浏览器可能连续下载两个文件";
        return;
      }
      const r = region();
      target.style.display = "block";
      const minV = CONFIG.target_top_exclusion_fraction + target.getBoundingClientRect().height / (2 * r.height);
      const u = 0.58 + Math.random() * 0.34;
      const v = minV + Math.random() * (CONFIG.target_v_max - minV);
      targetUV = { u, v };
      target.style.left = `${r.left + u * r.width}px`;
      target.style.top = `${r.top + v * r.height}px`;
      active = true;
      progress.textContent = `${trial + 1} / ${CONFIG.trial_count}`;
    }
    async function requestFullscreen() {
      const root = document.documentElement;
      const request = root.requestFullscreen || root.webkitRequestFullscreen;
      if (document.fullscreenElement || !request) return;
      try {
        await request.call(root, { navigationUI: "hide" });
      } catch (_) {}
    }
    async function start() {
      if (startButton.disabled || !DEVICES[deviceSelect.value]) return;
      sessionDeviceId = deviceSelect.value;
      deviceSelect.disabled = true;
      startButton.disabled = true;
      await requestFullscreen();
      sessionDisplay = displayDimensions(); sessionRegion = region();
      updateDisplayInfo();
      clearTimeout(nextTimer);
      records.length = 0; trial = 0; targetUV = null; active = false;
      sessionId = "session_" + new Date().toISOString().replace(/[-:.TZ]/g, "") + "_" + (++sessionNumber);
      startButton.style.display = "none"; exportButton.style.display = "none";
      document.body.classList.add("collecting");
      setTimeout(nextTarget, 100);
    }
    function onTarget(event) {
      if (!active || !targetUV) return;
      event.preventDefault();
      const r = region();
      const time = performance.now();
      const x = event.clientX, y = event.clientY;
      records.push({
        schema_version: CONFIG.schema_version, session_id: sessionId,
        device_id: sessionDeviceId, ...displayDimensions(),
        trial_id: `trial_${String(trial).padStart(4, "0")}`, touch_index: 0,
        touch_time_browser_ms: time.toFixed(3), client_x: x.toFixed(3), client_y: y.toFixed(3),
        region_left: r.left.toFixed(3), region_top: r.top.toFixed(3),
        region_width_css_px: r.width.toFixed(3), region_height_css_px: r.height.toFixed(3),
        touch_u: ((x - r.left) / r.width).toFixed(6), touch_v: ((y - r.top) / r.height).toFixed(6),
        target_u: targetUV.u.toFixed(6), target_v: targetUV.v.toFixed(6)
      });
      active = false; target.style.display = "none"; trial += 1;
      document.body.classList.add("flash");
      setTimeout(() => document.body.classList.remove("flash"), CONFIG.flash_duration_ms);
      clearTimeout(nextTimer);
      nextTimer = setTimeout(nextTarget, CONFIG.inter_trial_delay_ms);
    }
    function csv() {
      const fields = Object.keys(records[0] || {});
      return [fields.join(","), ...records.map(row => fields.map(k => row[k]).join(","))].join("\n") + "\n";
    }
    function download(name, content, type) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    for (const [id, device] of Object.entries(DEVICES)) {
      const option = document.createElement("option");
      option.value = id; option.textContent = device.model; deviceSelect.appendChild(option);
    }
    deviceSelect.addEventListener("change", () => {
      startButton.disabled = !DEVICES[deviceSelect.value];
      updateDisplayInfo();
    });
    window.addEventListener("resize", updateDisplayInfo);
    document.addEventListener("fullscreenchange", updateDisplayInfo);
    updateDisplayInfo();
    status.textContent = `共 ${CONFIG.trial_count} 次，请先启动眼镜录像`;
    startButton.addEventListener("click", start);
    target.addEventListener("pointerdown", onTarget);
    exportButton.addEventListener("click", () => {
      if (trial < CONFIG.trial_count) return;
      download(`${sessionId}_touches.csv`, csv(), "text/csv;charset=utf-8");
      download(`${sessionId}_session.json`, JSON.stringify({
        schema_version: CONFIG.schema_version, session_id: sessionId, participant_id: "anonymous",
        hand: CONFIG.hand, crossing_direction: CONFIG.crossing_direction,
        device_id: sessionDeviceId, device: DEVICES[sessionDeviceId].model, ...sessionDisplay,
        region_left: sessionRegion.left, region_top: sessionRegion.top,
        region_width_css_px: sessionRegion.width, region_height_css_px: sessionRegion.height,
        trial_count: records.length,
        collection_config: CONFIG
      }, null, 2), "application/json");
      deviceSelect.disabled = false;
      startButton.textContent = "重新开始采集";
      startButton.disabled = !DEVICES[deviceSelect.value];
      startButton.style.display = "inline-block";
      status.textContent = "已发起两个文件的下载，请确认均已保存；启动新的眼镜录像后，可重新开始采集";
    });
  </script>
</body>
</html>
